name: 크래시 보고 (Crash report)
description: 앱이 갑자기 꺼졌고, 다음 실행 때 보고서가 나왔어요.
title: "크래시: "
labels: [crash]
body:
  - type: markdown
    attributes:
      value: |
        앱이 다음 실행 때 보여 준 보고서를 그대로 붙여 넣어 주세요. "GitHub에 올리기"로 오셨다면 이미 채워져 있어요.
        보고서에는 입력, 채팅, 이름, 주소가 들어 있지 않아서 그대로 공개해도 괜찮아요.
        Paste the report the app showed at its next start. It holds no input, chat, names or addresses.
  - type: textarea
    id: report
    attributes:
      label: 보고서 (Report)
      description: "`crpp crash report`로 시작하는 글 전부 (The whole text, from its first line)"
      render: text
    validations:
      required: true
  - type: textarea
    id: doing
    attributes:
      label: 직전에 하던 일 (What you were doing)
      description: 기억나는 만큼만 적어 주세요. 예) 방에 들어가자마자, 설정에서 스킨을 바꾸던 중
    validations:
      required: false
  - type: input
    id: windows
    attributes:
      label: Windows 버전 (Windows version)
      description: 보고서에 있으면 비워 두셔도 돼요.
      placeholder: Windows 11 24H2
    validations:
      required: false
