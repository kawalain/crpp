name: 버그 보고 (Bug report)
description: 꺼지지는 않았지만 무언가 잘못 동작해요.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: 재현 순서 (Steps to reproduce)
      description: 처음부터 같은 일이 생기기까지 한 일을 차례로 적어 주세요.
      placeholder: |
        1. 방을 만든다
        2. 설정에서 사운드 탭을 연다
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과 (Expected)
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과 (Actual)
      description: 스크린샷이 있으면 끌어다 놓아 주세요. 채팅이나 방 코드가 보이면 가려 주세요.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 버전 (Version)
      description: 설정 화면에 보이는 버전 (The version shown in Settings)
      placeholder: v0.4.0 (abc1234)
    validations:
      required: true
  - type: input
    id: skin
    attributes:
      label: 스킨과 테마 (Skin and Theme)
      placeholder: Cloud, 구름
    validations:
      required: false
  - type: input
    id: windows
    attributes:
      label: Windows 버전 (Windows version)
      placeholder: Windows 11 24H2
    validations:
      required: false
