# Publishes an existing tag v0.y.z on main: one exe and its signed manifest. Every check
# comes before anything is published, and a failed run publishes nothing.
# Releases are normally made with .github/scripts/release.ps1 on a developer's machine. This
# runs only by hand, as Actions minutes are limited: gh workflow run release.yml --ref v0.y.z
# See docs/signing-key.md for the key and docs/releases/README.md for the notes.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      # Full history: the asset manifest pins the commit that last changed assets/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag, the notes and the key
        id: tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG -notmatch '^v(0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$') { throw "not a version tag: $env:TAG" }
          $version = $Matches[1]
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'the tag is not on main' }
          .github/scripts/release-notes.ps1 -Tag $env:TAG -Out dist/release-notes.md
          # The build's version says so if the tree differs from the tag.
          if (git status --porcelain) { throw "the tree is not clean: $(git status --porcelain)" }
          if ((Get-Content -Raw src/update/release_public_key.txt).Trim() -eq 'PLACEHOLDER') {
            throw 'src/update/release_public_key.txt still holds the placeholder; see docs/signing-key.md'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: cmd
        run: .github\scripts\msvc-build.cmd build "-DCRPP_FETCH_DEV_ASSETS=OFF" "-DCRPP_OFFICIAL_BUILD=ON" "-DCRPP_VERSION=${{ steps.tag.outputs.version }}"

      - name: Test
        shell: pwsh
        run: ctest --test-dir build --output-on-failure -E "^input\.raw$"

      - name: Sign
        shell: pwsh
        env:
          CRPP_UPDATE_SIGNING_KEY: ${{ secrets.CRPP_UPDATE_SIGNING_KEY }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item build/apps/gui/crpp.exe dist/crpp.exe
          .github/scripts/sign-release.ps1 -Exe dist/crpp.exe -Version $env:VERSION -Out dist/crpp-update.manifest
          Get-Content dist/crpp-update.manifest

      # Against the key built into this very exe's build: a secret that does not match
      # would otherwise strand every installed copy.
      - name: Verify as the app will
        shell: pwsh
        run: |
          build/src/update/crpp_update_verify.exe dist/crpp-update.manifest dist/crpp.exe
          if ($LASTEXITCODE -ne 0) { throw 'the release does not verify' }

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          .github/scripts/publish-release.ps1 -Tag $env:TAG
