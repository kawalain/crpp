# Pure modules stay portable (GCC on Linux); the whole app builds with the compiler that
# releases use (MSVC). input.raw is left out where it runs: it injects keys and needs a
# real input desktop, which a runner is not known to have.
# Runs only by hand, as Actions minutes are limited: gh workflow run ci.yml
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-gcc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-14
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-msvc:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        shell: bash
        run: .github/scripts/msvc-build.sh build
      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure -E '^input\.raw$'
